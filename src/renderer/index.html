<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; media-src * blob: data:; connect-src * blob: data:; worker-src 'self' blob:; font-src 'self' data:">
<title>RR Streaming</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav id="nav">
    <div class="brand"><span class="logo">RR</span><span class="brand-name">Streaming</span></div>
    <div class="tabs" role="tablist">
      <a class="tab" data-focus href="#/home" data-route="home">Accueil</a>
      <a class="tab" data-focus href="#/movies" data-route="movies">Films</a>
      <a class="tab" data-focus href="#/tv" data-route="tv">Séries</a>
      <a class="tab" data-focus href="#/anime" data-route="anime">Animes</a>
      <a class="tab" data-focus href="#/search" data-route="search" aria-label="Recherche">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.24a1 1 0 0 1-1.41 1.41l-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      </a>
      <a class="tab" data-focus href="#/sources" data-route="sources">Sources</a>
      <a class="tab" data-focus href="#/settings" data-route="settings">Réglages</a>
    </div>
    <div class="nav-spacer"></div>
  </nav>

  <main id="view"></main>

  <div id="player" class="hidden" aria-hidden="true">
    <div class="player-backdrop"></div>
    <video id="video" playsinline></video>
    <div class="player-loading">
      <div class="spinner"></div>
      <div class="pl-title"></div>
      <div class="pl-status"></div>
      <ul class="pl-log"></ul>
      <div class="pl-actions"></div>
    </div>
    <div class="player-chrome">
      <div class="pc-top">
        <button class="pc-btn" data-act="back" aria-label="Retour">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 1 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z"/></svg>
        </button>
        <div class="pc-title"></div>
        <div class="pc-source"></div>
      </div>
      <div class="pc-bottom">
        <div class="pc-bar">
          <span class="pc-time cur">0:00</span>
          <div class="pc-track"><div class="pc-buffer"></div><div class="pc-progress"></div><div class="pc-knob"></div></div>
          <span class="pc-time dur">-0:00</span>
        </div>
        <div class="pc-controls">
          <button class="pc-btn" data-act="back10" aria-label="Reculer de 10 s">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8Z"/><text x="12" y="16" font-size="6.5" text-anchor="middle" fill="currentColor" font-family="system-ui" font-weight="700">10</text></svg>
          </button>
          <button class="pc-btn big" data-act="play" aria-label="Lecture / pause">
            <svg class="i-play" viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11.1-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg>
          </button>
          <button class="pc-btn" data-act="fwd10" aria-label="Avancer de 10 s">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8Z"/><text x="12" y="16" font-size="6.5" text-anchor="middle" fill="currentColor" font-family="system-ui" font-weight="700">10</text></svg>
          </button>
          <div class="pc-flex"></div>
          <button class="pc-btn" data-act="fullscreen" aria-label="Plein écran">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 9V4h5v2H6v3H4Zm10-5h6v5h-2V6h-4V4ZM6 15v3h3v2H4v-5h2Zm12 0h2v5h-6v-2h4v-3Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <div id="update-banner" class="hidden">
    <span class="ub-text"></span>
    <button class="pill white" data-focus id="ub-install">Redémarrer</button>
  </div>

  <script src="../../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="../../node_modules/dashjs/dist/modern/umd/dash.all.min.js"></script>
  <script src="ui.js"></script>
  <script src="player.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
