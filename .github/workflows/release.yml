name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Vérifier que la version du tag correspond à package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à package.json ($PKG)"; exit 1
          fi

      - name: Créer le tag de version (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Le tag $TAG existe déjà : augmentez la version dans package.json"; exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Construire l'installateur et l'envoyer dans une release brouillon
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # La release n'est rendue publique qu'une fois l'installateur et latest.yml envoyés :
      # les installations existantes ne voient jamais une release incomplète.
      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" --json assets -q '.assets[].name' | tee assets.txt
          grep -q '^latest.yml$' assets.txt || { echo "::error::latest.yml manquant"; exit 1; }
          grep -q '\.exe$' assets.txt || { echo "::error::installateur manquant"; exit 1; }
          gh release edit "$TAG" --draft=false --latest

      - uses: actions/upload-artifact@v4
        with:
          name: RR-Streaming-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
