name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Préparer le tag de version
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q "[.[] | select(.tag_name == \"$TAG\" and (.draft | not))] | length")
          if [ "$PUBLISHED" != "0" ]; then
            echo "::error::La release $TAG est déjà publiée : augmentez la version dans package.json"; exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Construire l'installateur
        run: npx electron-builder --win --publish never

      # Une seule création de release, avec tous les fichiers : les installations existantes
      # (electron-updater lit latest.yml) ne voient jamais une release incomplète.
      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ls -la dist
          test -f dist/latest.yml || { echo "::error::dist/latest.yml manquant"; exit 1; }
          VERSION="${TAG#v}"
          EXE="dist/RR-Streaming-Setup-$VERSION.exe"
          test -f "$EXE" || { echo "::error::$EXE manquant"; exit 1; }
          FILES=("$EXE" dist/latest.yml)
          [ -f "$EXE.blockmap" ] && FILES+=("$EXE.blockmap")
          gh release create "$TAG" "${FILES[@]}" \
            --title "RR Streaming $VERSION" \
            --notes "Installateur Windows : **RR-Streaming-Setup-$VERSION.exe**. Les installations existantes se mettent à jour automatiquement." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: RR-Streaming-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
